name: Release version

on:
  pull_request:
    paths:
      - "src/**"
      - "bundle.md"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/install.sh"
      - "scripts/install.ps1"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv run python scripts/check_release_version.py --base-ref origin/${{ github.base_ref }}
