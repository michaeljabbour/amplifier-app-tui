name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a content-verified commit SHA, not a floating tag
      # (compliance B9): a tag can be moved/retargeted; a SHA cannot. Re-verify
      # via `git ls-remote --tags <repo>` before bumping either version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src/
      # Coverage tracing slows rendering enough to blow the 16ms frame budget
      # and perturb snapshot timing on CI runners, so the perf and snapshot
      # tests run uninstrumented in their own step (coverage is 89% either way).
      - run: uv run pytest -q --cov=src/amplifier_app_tui --cov-report=term --cov-fail-under=85
          --ignore=tests/test_perf_spike.py --ignore=tests/test_ui_snapshots.py
      - run: uv run pytest -q tests/test_perf_spike.py tests/test_ui_snapshots.py

  source-install-smoke:
    name: source install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install the checked-out commit
        env:
          AMPLIFIER_TUI_REPO_URL: file://${{ github.workspace }}
          AMPLIFIER_TUI_UPDATE_SHELL: "0"
        run: |
          sh -n scripts/install.sh
          bash -n scripts/install.sh
          sh scripts/install.sh --ref "$GITHUB_SHA" --no-update-shell
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      # A new Actions step is a new shell: this proves the bare executable, not
      # merely the absolute path the installer used for its own verification.
      - name: Verify from a fresh shell and reinstall
        env:
          AMPLIFIER_TUI_REPO_URL: file://${{ github.workspace }}
          AMPLIFIER_TUI_UPDATE_SHELL: "0"
        run: |
          amplifier-tui --help >/dev/null
          amplifier-tui version
          doctor_status=0
          amplifier-tui doctor || doctor_status=$?
          test "$doctor_status" -le 1
          sh scripts/install.sh --ref "$GITHUB_SHA" --no-update-shell
          amplifier-tui --help >/dev/null
      - name: Uninstall the app only
        run: |
          app_bin="$(command -v amplifier-tui)"
          uv tool uninstall amplifier-app-tui
          test ! -e "$app_bin"

  source-install-smoke-windows:
    name: source install (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Parse and install the checked-out commit
        shell: pwsh
        env:
          AMPLIFIER_TUI_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          AMPLIFIER_TUI_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & scripts/install.ps1 -Ref $env:AMPLIFIER_TUI_INSTALL_REF -NoUpdateShell
          $binDir = (& uv tool dir --bin).Trim()
          $app = Join-Path $binDir "amplifier-tui.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "amplifier-tui.exe was not installed"
          }
          & $app --help | Out-Null
          & $app version
          & scripts/install.ps1 -Ref $env:AMPLIFIER_TUI_INSTALL_REF -NoUpdateShell
          & $app --help | Out-Null
      - name: Uninstall the app only
        shell: pwsh
        run: |
          $binDir = (& uv tool dir --bin).Trim()
          $app = Join-Path $binDir "amplifier-tui.exe"
          & uv tool uninstall amplifier-app-tui
          if (Test-Path -LiteralPath $app) { throw "$app still exists after uninstall" }
